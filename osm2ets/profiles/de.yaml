# osm2ets – Länderprofil Deutschland
#
# Straßenkategorien folgen der in Deutschland üblichen OSM-Konvention:
#   motorway  = Bundesautobahn
#   trunk     = autobahnähnliche Straße / Kraftfahrstraße
#   primary   = meist Bundesstraße
#   secondary = meist Landes-/Staatsstraße
#   tertiary  = meist Kreisstraße
# Das ist eine Konvention, keine harte Regel. Die Detailstufen richten sich nach der
# Klasse (highway=*), nicht nach der Nummer im ref-Tag.

name: de
description: Deutschland

projection:
  # ETRS89 / UTM Zone 32N. Für ganz Deutschland brauchbar (Maßstabsfehler am
  # Ostrand etwa 0,2 %).
  crs: "EPSG:25832"
  # Fester Ursprung (Längengrad, Breitengrad) = Spielkoordinate (0, 0).
  # Bewusst fest statt "Mitte des Ausschnitts": So passen Teilgebiete, die
  # getrennt erzeugt werden, später nahtlos zusammen.
  # Wert: geographischer Mittelpunkt Deutschlands (Niederdorla).
  origin_lonlat: [10.4477, 51.1634]

scale:
  # Maßstab 1:N. 1.0 = Echtgröße. Vanilla-ETS2 nutzt etwa 1:19.
  horizontal: 1.0
  # Höhenmaßstab; null = gleich dem horizontalen (Steigungen bleiben erhalten).
  vertical: null

# Einheiten: Alles, was die Geometrie im Spiel betrifft, ist in SPIELmetern
# angegeben (nach Maßstab) – Fahrzeuge sind im Spiel immer 1:1 groß, deshalb
# gelten Segmentgrenzen, Brückenhöhen und Rampensteigungen dort. Nur Werte, die
# sich auf die echte Welt beziehen (Abtastabstand, Geländeglättung), sind in
# Echtmetern.
geometry:
  # Abtastabstand für Höhenprofil und Vereinfachung (Echtmeter).
  densify_m: 20.0
  # Maximale Lageabweichung der vereinfachten Linie (Spielmeter).
  simplify_tolerance_game_m: 0.5
  # Maximale Höhenabweichung bei der Vereinfachung (Spielmeter).
  vertical_tolerance_game_m: 0.25
  # Kürzestes Straßenstück in SPIELmetern (nach Maßstab). Spiel/TruckLib:
  # Untergrenze 1,25 m; unter ~5 m wird die Darstellung unsauber.
  min_segment_game_m: 5.0
  # Längstes Straßenstück in SPIELmetern. Spielgrenze 1000 m; TruckLib prüft
  # das nicht selbst.
  max_segment_game_m: 500.0

elevation:
  # Glättungsfenster für das Geländeprofil entlang der Straße (Echtmeter).
  smoothing_window_m: 120.0
  # Höhe je Ebene (OSM layer) für Brücken, z. B. Überführungen (Spielmeter).
  bridge_clearance_m: 6.0
  # Maximale Steigung der Rampen vor und hinter Brücken (im Spiel).
  max_ramp_grade: 0.05
  # Größte Steigung des Geländeprofils entlang der Straßen (vor Brückenrampen).
  # Bundesautobahnen haben meist ≤ 4 %, Landstraßen selten > 8 %.
  terrain_max_grade: 0.06
  # Höchstens so viele Brückenebenen übereinander (begrenzt das automatische
  # Anheben an Kreuzungen; was darüber hinaus nötig wäre, meldet der Bericht).
  max_bridge_levels: 4
  # Kürzere Brücken (Echtmeter, ganzes Bauwerk) werden nicht angehoben –
  # meist Durchlässe über Gräben. Liegt doch eine Straße darunter, hebt die
  # Kreuzungsprüfung die Brücke trotzdem an.
  min_bridge_length_m: 8.0

network:
  # Klassen, die ohne oneway-Tag als Einbahn gelten (Richtungsfahrbahnen).
  implied_oneway: [motorway, motorway_link]
  # Wege mit access=no/private werden ignoriert, außer Kfz sind explizit erlaubt.
  exclude_access: ["no", "private"]
  # service-Wege dieser Arten zählen nicht als Straße.
  exclude_service: [parking_aisle, driveway, drive-through, emergency_access]

# Befahrbare Straßenklassen (alles, worüber Zusatzstraßen der Detailstufen führen dürfen).
# Nicht dabei: track (Feld-/Waldwege), path, footway, cycleway, bridleway, pedestrian –
# die gibt es nur in L5 (nicht im Navi bzw. als Geheimstraße) –, steps, construction,
# proposed, raceway, busway.
drivable: &drivable [motorway, trunk, primary, secondary, tertiary,
                     motorway_link, trunk_link, primary_link, secondary_link, tertiary_link,
                     unclassified, residential, living_street, service, road]

# Zusätzlich in JEDER Detailstufe (siehe extras.py):
extras:
  # 2. Kurze Verbindung zwischen zwei Straßen der Stufe (z. B. das Stück Bundesstraße
  #    zwischen zwei Autobahnrampen in L1): höchstens so lang (Echtmeter) ...
  same_level_max_m: 500
  #    ... und nur, wenn der Weg über das Netz der Stufe mindestens so viel länger ist –
  #    sonst wäre es nur eine Schleife an derselben Straße (Wendeschleife, Parallelweg).
  same_level_ratio: 1.5
  #    Ausnahme Rastplätze: Schleifen, die an beiden Enden an einer Autobahn- oder
  #    Kraftfahrstraßenfahrbahn hängen, zählen immer – bis zu dieser Länge.
  #    (Tankstellen, Rastanlagen und Lkw-Parkplätze mit eigenem OSM-Tag: siehe industry)
  rest_loop_max_m: 1500
  # 3. Notfallbuchten/Notauffahrten (highway=escape), die direkt an der Strecke liegen
  escape: true
  # Straßenklassen, über die Verbindungen (2.) und Zufahrten (1.) führen dürfen
  via_highway: *drivable

# 1. Zufahrten zu Industrie/Gewerbe/Firmen – in allen Detailstufen: Ziele höchstens
#    max_distance_m (Weg entlang der Straße) von einer Kreuzung bzw. Abfahrt des Netzes;
#    erreichte Gebiete werden ganz aufgenommen. Auf Autobahnen/Kraftfahrstraßen selbst
#    beginnt keine Zufahrt (nur an Rampenenden) – eine Firma neben der Autobahn ohne nahe
#    Ausfahrt zieht so keine kilometerlangen Straßen nach sich.
#    Tankstellen (amenity=fuel), Rastanlagen (highway=services|rest_area) und Lkw-Parkplätze
#    (amenity=parking + hgv=yes|designated) werden ebenso angebunden, aber auch direkt von
#    der Autobahnfahrbahn aus und über alle Zu- und Abfahrten (Schleife bleibt befahrbar).
industry:
  enabled: true
  # Straßenklassen, über die eine Zufahrt führen darf
  highway: *drivable
  # Höchstens so weit (Echtmeter, Weg entlang der Straße) vom gewählten Netz entfernt
  max_distance_m: 300
  # So weit wird noch ins Gebiet hineingefahren (Platz für ein Firmen-Prefab)
  inside_m: 150

# Detailstufen: jede Stufe enthält die vorige (Kern = Straßenklassen der Stufe,
# Rampen nur, wenn sie das Kernnetz berühren) plus die Zusätze oben (extras, industry).
lods:
  L1:
    description: Autobahnen und Kraftfahrstraßen mit Rampen
    core:
      - highway: [motorway, trunk]
    links: [motorway_link, trunk_link]

  L2:
    description: L1 + primary (meist Bundesstraßen) mit Rampen
    core:
      - highway: [motorway, trunk, primary]
    links: [motorway_link, trunk_link, primary_link]

  L3:
    description: L2 + secondary (meist Landes-/Staatsstraßen) mit Rampen
    core:
      - highway: [motorway, trunk, primary, secondary]
    links: [motorway_link, trunk_link, primary_link, secondary_link]

  L4:
    description: L3 + tertiary (meist Kreisstraßen) mit Rampen
    core:
      - highway: [motorway, trunk, primary, secondary, tertiary]
    links: [motorway_link, trunk_link, primary_link, secondary_link, tertiary_link]

  L5:
    description: >-
      L4 + alle übrigen Wege: unclassified, residential, living_street, service (auch
      Parkplatzgassen und Grundstückszufahrten), road, track, path, footway, cycleway,
      bridleway, pedestrian, auch ohne Kfz-Zugang (access=private|no). Wege ohne
      Lkw-Verkehr und gesperrte Wege sind im Spiel nicht im Navi, Feld- und Waldwege
      (track) sind Geheimstraßen. Flächen und Gebäude fehlen noch.
    core:
      - highway: [motorway, trunk, primary, secondary, tertiary,
                  unclassified, residential, living_street, service, road,
                  track, path, footway, cycleway, bridleway, pedestrian]
    links: [motorway_link, trunk_link, primary_link, secondary_link, tertiary_link]
    # in L5 auch Parkplatzgassen, Grundstückszufahrten, Drive-in, Notzufahrten …
    exclude_service: []
    # … und Wege ohne Kfz-Zugang (access=private|no, z. B. Firmengelände) – im Spiel
    # nicht im Navi (Writer: "restricted" in mapping.jsonc)
    exclude_access: []
