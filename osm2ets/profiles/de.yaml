# osm2ets – Länderprofil Deutschland
#
# Straßenkategorien folgen der in Deutschland üblichen OSM-Konvention:
#   motorway  = Bundesautobahn
#   trunk     = autobahnähnliche Straße / Kraftfahrstraße
#   primary   = meist Bundesstraße (zusätzlich über die B-Nummer im ref-Tag erkannt)
#   secondary = meist Landes-/Staatsstraße
#   tertiary  = meist Kreisstraße
# Das ist eine Konvention, keine harte Regel – deshalb erkennt L1 Bundesstraßen
# zusätzlich an der Nummer ("B 85") statt nur an der Klasse.

name: de
description: Deutschland

projection:
  # ETRS89 / UTM Zone 32N. Für ganz Deutschland brauchbar (Maßstabsfehler am
  # Ostrand etwa 0,2 %).
  crs: "EPSG:25832"
  # Fester Ursprung (Längengrad, Breitengrad) = Spielkoordinate (0, 0).
  # Bewusst fest statt "Mitte des Ausschnitts": So passen Teilgebiete, die
  # getrennt erzeugt werden, später nahtlos zusammen.
  # Wert: geographischer Mittelpunkt Deutschlands (Niederdorla).
  origin_lonlat: [10.4477, 51.1634]

scale:
  # Maßstab 1:N. 1.0 = Echtgröße. Vanilla-ETS2 nutzt etwa 1:19.
  horizontal: 1.0
  # Höhenmaßstab; null = gleich dem horizontalen (Steigungen bleiben erhalten).
  vertical: null

# Einheiten: Alles, was die Geometrie im Spiel betrifft, ist in SPIELmetern
# angegeben (nach Maßstab) – Fahrzeuge sind im Spiel immer 1:1 groß, deshalb
# gelten Segmentgrenzen, Brückenhöhen und Rampensteigungen dort. Nur Werte, die
# sich auf die echte Welt beziehen (Abtastabstand, Geländeglättung), sind in
# Echtmetern.
geometry:
  # Abtastabstand für Höhenprofil und Vereinfachung (Echtmeter).
  densify_m: 20.0
  # Maximale Lageabweichung der vereinfachten Linie (Spielmeter).
  simplify_tolerance_game_m: 0.5
  # Maximale Höhenabweichung bei der Vereinfachung (Spielmeter).
  vertical_tolerance_game_m: 0.25
  # Kürzestes Straßenstück in SPIELmetern (nach Maßstab). Spiel/TruckLib:
  # Untergrenze 1,25 m; unter ~5 m wird die Darstellung unsauber.
  min_segment_game_m: 5.0
  # Längstes Straßenstück in SPIELmetern. Spielgrenze 1000 m; TruckLib prüft
  # das nicht selbst.
  max_segment_game_m: 500.0

elevation:
  # Glättungsfenster für das Geländeprofil entlang der Straße (Echtmeter).
  smoothing_window_m: 120.0
  # Höhe je Ebene (OSM layer) für Brücken, z. B. Überführungen (Spielmeter).
  bridge_clearance_m: 6.5
  # Maximale Steigung der Rampen vor und hinter Brücken (im Spiel).
  max_ramp_grade: 0.05
  # Höchstens so viele Brückenebenen übereinander (begrenzt das automatische
  # Anheben an Kreuzungen; was darüber hinaus nötig wäre, meldet der Bericht).
  max_bridge_levels: 4
  # Kürzere Brücken (Echtmeter, ganzes Bauwerk) werden nicht angehoben –
  # meist Durchlässe über Gräben. Liegt doch eine Straße darunter, hebt die
  # Kreuzungsprüfung die Brücke trotzdem an.
  min_bridge_length_m: 8.0

network:
  # Klassen, die ohne oneway-Tag als Einbahn gelten (Richtungsfahrbahnen).
  implied_oneway: [motorway, motorway_link]
  # Wege mit access=no/private werden ignoriert, außer Kfz sind explizit erlaubt.
  exclude_access: ["no", "private"]
  # service-Wege dieser Arten zählen nicht als Straße.
  exclude_service: [parking_aisle, driveway, drive-through, emergency_access]

lods:
  L1:
    description: >-
      Autobahnen, Kraftfahr- und Bundesstraßen inkl. Rampen sowie die
      anschließenden Straßen bis zur nächsten Kreuzung
    core:
      - highway: [motorway, trunk]
      - highway: [primary, secondary, tertiary]
        ref_regex: '(^|;)\s*B\s?\d+'
    links: [motorway_link, trunk_link, primary_link]
    connectors:
      # Wie viele Kreuzungen weit anschließende Straßen verfolgt werden.
      depth: 1
      highway: [primary, secondary, tertiary, unclassified, residential,
                living_street, secondary_link, tertiary_link]

  L2:
    description: L1 + Landes-/Staats- und Kreisstraßen
    core:
      - highway: [motorway, trunk, primary, secondary, tertiary]
    links: [motorway_link, trunk_link, primary_link, secondary_link, tertiary_link]
    connectors:
      depth: 1
      highway: [unclassified, residential, living_street]

  L3:
    description: L2 + Gemeinde- und Innerortsstraßen
    core:
      - highway: [motorway, trunk, primary, secondary, tertiary,
                  unclassified, residential, living_street]
    links: [motorway_link, trunk_link, primary_link, secondary_link, tertiary_link]
    connectors:
      depth: 1
      highway: [service]

  L4:
    description: >-
      L3 + Erschließungswege (service, z. B. Rastanlagen). Flächen und
      Gebäude sind in dieser Version noch nicht umgesetzt.
    core:
      - highway: [motorway, trunk, primary, secondary, tertiary,
                  unclassified, residential, living_street, service]
    links: [motorway_link, trunk_link, primary_link, secondary_link, tertiary_link]
    connectors:
      depth: 0
      highway: []
