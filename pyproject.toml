[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osm2ets"
version = "0.1.0"
description = "OpenStreetMap -> Euro Truck Simulator 2: Straßennetz in Detailstufen als Zwischenformat für den TruckLib-Writer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "osmium>=4.0",
    "pyproj>=3.5",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dem = ["rasterio>=1.3", "scipy>=1.10"]
test = ["pytest>=7"]

[project.scripts]
osm2ets = "osm2ets.cli:main"

[tool.setuptools.packages.find]
include = ["osm2ets*"]

[tool.setuptools.package-data]
osm2ets = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
